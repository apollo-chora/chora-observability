services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chora_observability
      POSTGRES_USER: chora
      POSTGRES_PASSWORD: chora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chora -d chora_observability"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - observability-postgres:/var/lib/postgresql
      - ./deploy/local/init-db.sh:/docker-entrypoint-initdb.d/10-chora-observability.sh:ro
      - ./migrations:/migrations:ro

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=chora-local
      - --host-port=0.0.0.0:8085
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/8085"]
      interval: 2s
      timeout: 3s
      retries: 30

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    depends_on:
      pubsub:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      CLOUDSDK_CORE_PROJECT: chora-local
    volumes:
      - ./deploy/local/init-pubsub.sh:/init-pubsub.sh:ro
    entrypoint: ["/bin/bash", "/init-pubsub.sh"]
    restart: "no"

  observability:
    image: ${CHORA_OBSERVABILITY_IMAGE:?set CHORA_OBSERVABILITY_IMAGE to a built chora-observability image}
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      CHORA_DB_DSN: postgres://chora:chora@postgres:5432/chora_observability?sslmode=disable
      CHORA_PUBSUB_PROJECT: chora-local
      GOOGLE_CLOUD_PROJECT: chora-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      CHORA_TRACING_ENABLED: "false"
      CHORA_DECISION_BQ_ENABLED: "false"
      CHORA_EVAL_EVIDENCE_BQ: ""
    ports:
      - "${PORT:-8080}:8080"
      - "${CHORA_GRPC_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  observability-postgres:
