services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chora_observability
      POSTGRES_USER: chora
      POSTGRES_PASSWORD: chora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chora -d chora_observability"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - observability-postgres:/var/lib/postgresql
      - ./deploy/local/init-db.sh:/docker-entrypoint-initdb.d/10-chora-observability.sh:ro
      - ./migrations:/migrations:ro

  # NATS JetStream event bus. Streams are provisioned out-of-band
  # (scripts/nats-init.sh); the service refuses to start without NATS_URL.
  nats:
    image: nats:2-alpine
    command: ["-js"]
    healthcheck:
      test: ["CMD-SHELL", "nats server check health || wget -qO- http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "4222:4222"

  observability:
    image: ${CHORA_OBSERVABILITY_IMAGE:?set CHORA_OBSERVABILITY_IMAGE to a built chora-observability image}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHORA_STRICT_STARTUP: "true"
      CHORA_DB_DSN: postgres://chora:chora@postgres:5432/chora_observability?sslmode=disable
      NATS_URL: nats://nats:4222
      CHORA_SOURCE_PROJECT: chora-local
      CHORA_TRACING_ENABLED: "false"
    ports:
      - "${PORT:-8080}:8080"
      - "${CHORA_GRPC_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  observability-postgres:
