# Cloud Deploy PROD overlay for chora-observability.
# Inherits from chora-infra/k8s/services/chora-observability/ (base manifests).
# Namespace stays as `observability` (the existing prod namespace). Future
# prod-only hardening (PodDisruptionBudget, stricter resource limits,
# NetworkPolicy) lands as patches in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - ../../../../chora-infra/k8s/services/chora-observability

labels:
  - includeSelectors: false
    pairs:
      chora.dev/env: prod

# Image override is applied by Cloud Deploy at release time via the
# `images:` field in `gcloud deploy releases create --images=...`.
