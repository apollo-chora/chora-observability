# skaffold.yaml — Cloud Deploy rendering config for chora-observability.
#
# Used by Cloud Deploy delivery-pipeline `chora-observability-pipeline` at the
# "render" stage. Image substitution happens automatically: the build step
# emits the image:tag, Cloud Deploy injects it into the manifests at deploy
# time via the `images` field.
#
# Per-target profiles select the namespace overlay:
#   dev  → services/chora-observability/clouddeploy/dev/ (namespace: observability-dev)
#   prod → services/chora-observability/clouddeploy/prod/ (namespace: observability)
#
# The top-level `verify` block declares the smoke test that Cloud Deploy's
# VERIFY action runs after DEPLOY completes. Execution mode is
# `kubernetesCluster` — the verify container runs as a Kubernetes Job inside
# the same cluster, so it can reach the freshly deployed pod via the in-
# cluster ClusterIP service `chora-observability.<ns>.svc.cluster.local`.
#
# Canonical smoke: `grpc.health.v1.Health/Check` on port :9090 (Wave-1.5
# gRPC mass remediation 2026-05-16). Documentary mirror lives at
# `services/chora-observability/clouddeploy/verify.yaml` (standalone Cloud Build
# config) — both run the same RPC so evidence is consistent.
#
# statusCheckDeadlineSeconds: 1800 (30 min) on each profile — overrides
# skaffold's 600s default. Allows pods with slow terminationGrace +
# probe-warmup to complete rolling update without Cloud Deploy DEPLOY
# job timing out. See: docs/cicd/EVIDENCE_PACK_INDEX_2026-05-17.md
# (cascade-2026-05-18 chora-observability-52e369d entry).
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: chora-observability
profiles:
  - name: prod
    manifests:
      kustomize:
        paths:
          - prod
    deploy:
      kubectl:
        defaultNamespace: observability
      statusCheckDeadlineSeconds: 1800
    verify:
      - name: grpc-health-smoke
        timeout: 120
        container:
          name: grpc-health-smoke
          image: fullstorydev/grpcurl:v1.8.9-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ADDR="chora-observability.observability.svc.cluster.local:9090"
              echo "VERIFY: grpcurl -plaintext $ADDR grpc.health.v1.Health/Check"
              grpcurl -plaintext -connect-timeout 10 -max-time 30 "$ADDR" grpc.health.v1.Health/Check
        executionMode:
          kubernetesCluster: {}
